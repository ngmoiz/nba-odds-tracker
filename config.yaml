# ─────────────────────────────────────────────────────────────
# Configuration — NBA Odds Tracker
#
# Source de vérité de tous les seuils de détection et paramètres de planning.
# Règle 0.4.7 : rien ne doit être codé en dur dans le code Python.
# ─────────────────────────────────────────────────────────────

# --- Source de données : The Odds API (section 4.1) ---
api:
  sport: basketball_wnba      # sport suivi (paramétrable pour V2, pas une constante)
  region: us                  # région des bookmakers
  markets:                    # marchés collectés (coût quota = nb marchés × nb régions)
    - h2h                     # moneyline (vainqueur sec)
    - spreads                 # handicap
    - totals                  # over / under
  odds_format: decimal        # format des cotes

# --- Affichage (section 5) ---
display:
  timezone: Europe/Paris      # fuseau d'affichage ; la base stocke toujours en UTC

# --- Budget quota API (section 4.3) ---
quota:
  monthly_credits: 500        # plafond du plan gratuit
  cost_per_collection: 3      # 3 marchés × 1 région
  target_collections_per_day: 5
  reserve: 50                 # garde de réserve : skip des collectes non essentielles sous ce seuil

# --- Planning de collecte (section 4.3) ---
# Le planning est AUTO-ORDONNANCÉ (Lot 2) : un seul battement cron `*/20` (voir
# `scripts/setup_cron.sh`) ; le collecteur décide lui-même, à chaque tick, quoi
# collecter. Les cibles (matin, H-6, H-3, verdict, re-décision, clôture), leurs
# marchés et priorités sont définis plus bas dans `collector.targets`.
# (L'ancien bloc `schedule:` à créneaux fixes — morning/afternoon/hours_before_tipoff/
# h1_split_blocks — a été retiré : il n'était plus lu par le code.)

# --- Moteur de règles de détection (section 6.2) ---
# Chaque règle déclenchée ajoute des points au score de signal du match/sélection.
# Les seuils chiffrés de R5 et R7 seront formalisés à l'étape 1.3 (analyseur).
rules:
  R1_spread_line_move:
    threshold_points: 2.0     # |ligne actuelle − ligne d'ouverture| ≥ 2.0 points
    score: 3
  R2_steam_move:
    threshold_prob_pct: 5.0   # variation de probabilité implicite ≥ 5 %
    window_hours: 3           # sur une fenêtre ≤ 3 h
    score: 3
  R3_sustained_trend:
    min_consecutive_snapshots: 3  # même direction sur ≥ 3 relevés consécutifs
    score: 2
  R4_multi_bookmaker_sync:
    min_bookmakers: 4         # ≥ 4 bookmakers sur 5 dans le même sens
    score: 3
  R5_cross_market_coherence:  # confirmation : spread ET moneyline bougent dans le même sens
    min_spread_move_points: 1.0  # mouvement du spread consensus depuis l'ouverture ≥ 1.0 pt
    min_prob_move_pct: 3.0       # variation de proba moneyline dé-margée du consensus ≥ 3 %
    score: 2
  R6_bookmaker_divergence:
    threshold_prob_pct: 7.0   # un book s'écarte de ≥ 7 % (proba) du consensus → ANOMALIE
    score: 2
  R7_spread_moneyline_inconsistency:  # V1 : contradiction de favori chez un même book
    min_prob_gap_pct: 3.0     # écart de proba moneyline entre les deux issues ≥ 3 %
    min_abs_spread: 1.5       # |spread| ≥ 1.5 (exclut les pick'em)
    score: 2                  # → oriente vers ANOMALIE
    # Évolution V1.1 (voir journal) : comparer la proba moneyline à la proba implicite
    # du spread via Φ(spread/σ), σ configurable par ligue (~11.5 NBA).

  # Seuils de « mouvement négligeable » (quasi stable) pour le formatage des alertes.
  # En dessous, un mouvement est réel mais pas actionnable : la conclusion
  # « l argent va vers » est remplacée par « quasi stable » (ampleur affichée).
  movement_negligible_prob: 0.002   # 0,2 pt de proba (h2h/totals)
  movement_negligible_line: 0.25     # 0,25 pt de ligne (spreads)

# --- Décision finale à H-1 (section 6.4) ---
# La fenêtre de décision va désormais de H-2,5 à H-0,55 : sous decision_min_hours,
# l'analyseur ne produit plus ni alerte ni verdict (snapshot de clôture stocké, point).
decision:
  signal_score_threshold: 6   # score ≥ 6 ET cohérence globale → SIGNAL
  window_hours: 2.5           # borne haute : verdict/re-décision produits si le tip-off est dans cette fenêtre
  decision_min_hours: 0.55    # borne basse : sous ce délai, analyse ENTIÈRE sautée (alertes + verdict/
                              # re-décision) — garantit que le verdict n'est jamais rendu sur le même
                              # snapshot que la clôture (CLV non mesurable, cf. journal 2026-07-20).
                              # Piège géométrique (même famille que closing 0.25 vs tick 20 min,
                              # 2026-07-18) : doit rester STRICTEMENT compris entre hours_before de la
                              # cible 'closing' (0.4 h) et hours_before de 'redecision' (1.0 h) moins le
                              # pire retard de tick (20 min = 0,333 h), soit strictement entre 0.4 et
                              # 0.667 h. Retenu : 0.55 h (33 min). Contrainte VALIDÉE au démarrage
                              # (validate_collector_config) : un futur changement de tick ou de cible
                              # qui recréerait silencieusement l'un des deux pièges échoue ici.

# ─────────────────────────────────────────────────────────────
# --- Modèle de force Elo (V1.1, chantier B5) ---
#
# ⚠️ LU EN PRODUCTION DEPUIS LE LOT 4 — mais AUCUNE DÉCISION n'en dépend.
#
# Distinction à ne pas perdre, c'est tout l'enjeu de l'étape en cours :
#   • l'évaluateur LIT ce bloc pour entretenir les notes (write path) ;
#   • l'analyseur le LIT pour calculer et journaliser un edge (mode shadow) ;
#   • aucun verdict, aucune alerte, aucun score ne le consulte.
# Modifier une valeur ici change donc les notes et les lignes SHADOW des logs,
# mais ne peut pas changer un verdict. `edge_threshold_prob` (τ) en particulier
# n'a toujours AUCUN lecteur : comparer l'edge à un seuil est un acte de décision.
#
# Il reste une étape avant que le modèle décide :
#   activation — règle hybride bloquante, bump DECISION_LOGIC_VERSION → 4, nouveau J0.
# ─────────────────────────────────────────────────────────────
model:
  enabled: false              # INERTE : aucune DÉCISION ne dépend du modèle (activation = lot v4)
  # ── Lot 4 : le modèle observe et s'entretient, il ne décide toujours pas ──
  # Ces deux drapeaux sont volontairement SÉPARÉS de `enabled` : celui-ci signifie
  # « le modèle influence les verdicts », et il doit rester à false pendant que les
  # notes vivent et que l'edge s'observe. Les confondre reviendrait à ne pouvoir
  # regarder le modèle qu'en lui donnant déjà le pouvoir.
  shadow: true                # edge calculé et LOGGÉ au verdict ; aucune écriture, aucun effet
  ratings_write_path: true    # l'évaluateur entretient les notes après chaque match terminé
  ratings:
    gap_warning_days: 5       # au-delà de N jours sans match intégré pour une équipe,
                              # avertissement « trou probable ». C'est un « va regarder »,
                              # pas un diagnostic : une vraie coupure de calendrier le
                              # déclenche aussi.
                              #
                              # Valeur choisie sur la DISTRIBUTION observée des écarts
                              # entre matchs (493 transitions, saison WNBA 2026 complète,
                              # relevé du 2026-08-14) : 2 j ×240, 3 j ×130, 4 j ×54,
                              # 5 j ×20, 6 j et + ×34. À 3, l'alerte se déclenchait sur
                              # 22 % des transitions — une sur cinq, donc une alerte qu'on
                              # cesse d'ouvrir. À 5, elle tombe à ~7 %.
                              #
                              # Ce seuil peut se permettre d'être discret : le trou de
                              # LIGUE, lui, est prouvé par arithmétique et SANS seuil
                              # (`detect_league_gap`) — c'est lui le vrai filet en cas
                              # d'arrêt machine. L'alerte par équipe ne couvre que le
                              # cas résiduel d'un historique cassé sans trou de ligue.
  elo:
    initial_rating: 1500      # note de départ d'une équipe inconnue
    k_factor: 20              # facteur d'apprentissage de base
    k_factor_burnin: 40       # facteur accéléré tant que games_played < burnin_games
    burnin_games: 10          # nb de matchs avant de repasser au K nominal
    home_advantage_elo: 62    # avantage terrain en points Elo (~2,5 pt WNBA ; ~75 pour la NBA)
    elo_points_per_spread: 25 # 25 pts Elo ≈ 1 pt de spread (conversion note ↔ ligne)
    rest_adjustment_elo:      # ajustements de fraîcheur, en points Elo
      back_to_back: -50       # match la veille (~ −2 pt de spread)
      three_in_four: -25      # 3 matchs en 4 nuits — CUMULATIF avec back_to_back
      rested: 0               # ≥ 2 jours de repos = référence
  decision:                   # INERTE : lu par aucun code (sessions shadow/activation)
    min_games_for_edge: 10    # ratings « mûrs » avant que l'edge puisse bloquer
    edge_threshold_prob: 0.02 # τ : edge minimal (2 pts de proba) pour autoriser un SIGNAL
  sigma_by_league:            # σ pour Φ(spread/σ) — conversion spread ↔ probabilité
    basketball_nba: 11.5
    basketball_wnba: 10.5     # à calibrer sur données

# --- Notificateur Telegram (section 7) ---
# Le notificateur lit les alertes/verdicts non envoyés en base et les pousse sur
# Telegram. NO_BET reste enregistré en base pour l'évaluation des faux négatifs,
# mais n'est pas listé ici : il ne génère donc aucun message (évite le flux
# quotidien de « rien à signaler »).
notifier:
  verdicts_notified:          # types de verdict effectivement envoyés sur Telegram
    - SIGNAL
    - ANOMALIE
  verdicts_with_buttons:      # verdicts recevant les boutons de position (traités en 1.5)
    - SIGNAL
    - ANOMALIE

# --- Source des résultats finaux : balldontlie (section 12, journal) ---
# Réservée aux scores officiels (l'évaluateur), jamais aux cotes.
results:
  provider: balldontlie
  base_url: https://api.balldontlie.io
  # Chemin balldontlie par ligue : le namespace est dans le CHEMIN, pas un paramètre.
  # Le chemin est sélectionné automatiquement selon api.sport (règle 0.4.7).
  games_paths:
    # Chemin documenté (spec OpenAPI courante). Le legacy `/v1/games` reste servi
    # et renvoie un payload identique (vérifié par appel réel le 2026-08-07), mais
    # il n'est plus documenté : on suit la doc.
    basketball_nba:  /nba/v1/games    # namespace NBA
    basketball_wnba: /wnba/v1/games   # namespace WNBA
  # Fuseau de référence des dates de match côté balldontlie (calendrier US).
  calendar_timezone: America/New_York
  # Étranglement des appels (tier gratuit balldontlie = 5 requêtes/minute).
  # N'entame JAMAIS le quota The Odds API : source distincte, gratuite.
  # La première requête n'est jamais retardée — un appel d'une seule page
  # (cas de l'évaluateur) ne coûte donc aucune latence.
  rate_limit:
    min_interval_seconds: 13    # 13 s ≈ 4,6 req/min : marge sous le plafond de 5
    max_retries: 3              # tentatives supplémentaires sur 429 / coupure réseau
    backoff_base_seconds: 2     # 2, 4, 8 s — ignoré si l'en-tête Retry-After est fourni
  pagination:
    max_pages: 50               # borne dure anti-boucle ; dépassement = erreur, jamais troncature

# --- Backfill Elo (chantier B5, lot 3) — hors pipeline cron ---
# Rejeu d'une saison complète depuis balldontlie pour mûrir les notes `team_ratings`
# AVANT d'activer le modèle. Exécution manuelle, ponctuelle : aucun cron ne lit ce
# bloc, et rien ici n'influence une décision.
backfill:
  # Cache disque des réponses balldontlie : un backfill se met au point en plusieurs
  # passes, on ne paie le réseau qu'une fois. `data/` est déjà dans .gitignore.
  cache_dir: data/cache/balldontlie
  # Part finale de la saison réservée au test prédictif hold-out (notes gelées à la
  # coupure, matchs postérieurs jamais vus par le modèle).
  holdout_fraction: 0.2
  # Bornes de saison par ligue. `start_date` est volontairement large : la borne ne
  # coûte aucune requête supplémentaire (la pagination compte les matchs, pas les
  # jours) et laisse la donnée révéler le vrai début de saison.
  # Le script élargit encore d'un jour de chaque côté — sans la borne haute, les
  # matchs du soir de la dernière journée, indexés au lendemain en UTC par
  # balldontlie, seraient systématiquement perdus (réserve du journal 2026-08-08).
  seasons:
    basketball_wnba: {season: 2026, start_date: '2026-05-01'}
    basketball_nba:  {season: 2025, start_date: '2025-10-01'}
  # Alias de noms d'équipes : nom rendu par la source de résultats → nom canonique.
  #
  # LA CLÉ CANONIQUE DU PROJET EST LE NOM PORTÉ PAR `matches` (The Odds API). C'est
  # lui qu'interrogera le read path du modèle, par égalité STRICTE. Tout producteur de
  # notes — backfill comme write path de l'évaluateur — dérive sa clé par
  # `evaluator.reconcile.build_canonical_resolver`, jamais autrement : deux
  # producteurs qui normaliseraient différemment scinderaient une note en deux, et
  # `UNIQUE(sport, team)` ne verrait rien.
  #
  # Motif ici : balldontlie renvoie un `city` VIDE pour les deux franchises créées en
  # 2026, donc un `full_name` amputé de la ville (vérifié par appel réel le
  # 2026-08-09 ; les 13 autres équipes s'apparient au caractère près). `teams_match`
  # absorbe déjà ce cas côté évaluateur, mais par inclusion — une tolérance qui ne se
  # propage pas à une égalité stricte.
  #
  # Le jour où la source renseignera la ville, ces alias cesseront simplement de se
  # déclencher : la sonde les signalera comme inutilisés, rien ne cassera.
  team_aliases:
    basketball_wnba:
      Fire:  Portland Fire
      Tempo: Toronto Tempo

# --- Évaluateur (étape 1.6) ---
evaluator:
  lookback_days: 3            # fenêtre de rattrapage des matchs clos non encore évalués
  weekly_report_weekday: 0   # jour du rapport hebdo (0 = lundi) — implémenté après le bilan quotidien

# --- Collecteur auto-ordonnancé (Lot 2, architecture par vague) ---
collector:
  tick_interval_minutes: 20   # battement cron (72 exécutions/jour)
  wave_grouping_minutes: 45   # seuil de groupement des matchs en vagues
  targets:
    # Matin quotidien (09:00, inconditionnel)
    - name: morning
      hours_before: null      # Pas lié aux vagues (horaire fixe)
      markets: [h2h, spreads, totals]
      priority: 2
    # H-6 (6h avant tip-off le plus précoce de la vague)
    - name: h6
      hours_before: 6.0
      markets: [h2h, spreads, totals]
      priority: 2
    # H-3 (3h avant tip-off le plus précoce)
    - name: h3
      hours_before: 3.0
      markets: [h2h, spreads, totals]
      priority: 3
    # H-2 (verdict, 2h avant tip-off le plus précoce)
    - name: verdict
      hours_before: 2.0
      markets: [h2h, spreads, totals]
      priority: 1             # Jamais bloqué par la garde de réserve
    # H-1 (re-décision, 1h avant tip-off le plus précoce)
    - name: redecision
      hours_before: 1.0
      markets: [h2h, spreads, totals]
      priority: 1             # Jamais bloqué
    # H-0.4 (clôture, 24 min avant tip-off de CHAQUE match)
    # ⚠️ Fenêtre (24 min) > tick_interval_minutes (20 min) : contrainte VALIDÉE au
    # démarrage (validate_collector_config). À 0.25 (15 min < 20), les tip-offs à
    # minute ronde (:00/:20/:40) n'étaient jamais captés (simulation 2026-07-18).
    - name: closing
      hours_before: 0.4
      markets: dynamic        # Union des marchés des verdicts
      priority: 1             # Jamais bloqué
      per_match: true         # Cible calculée par match (pas sur earliest)
